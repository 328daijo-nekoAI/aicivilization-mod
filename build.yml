name: Build AI Civilization Mod

# コードがアップロード（push）されるたび、または手動実行で自動ビルドする
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Java 17 をセットアップ（Forge 1.20.1に必要）
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 8.1.1 をセットアップ（ForgeプラグインはGradle 9系に非対応のため）
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Gradle Wrapper を生成
        run: gradle wrapper --gradle-version 8.1.1

      - name: Gradle Wrapper の実行権限を付与
        run: chmod +x ./gradlew

      - name: ビルド実行
        run: ./gradlew build --no-daemon --stacktrace

      - name: ビルドログをアップロード（失敗時の調査用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/reports/
            **/*.log
          if-no-files-found: ignore

      - name: 完成したjarファイルをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: aicivilization-mod-jar
          path: build/libs/*.jar
