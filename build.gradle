plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = '0.1.0'
group = 'com.aicivilization.mod'

base {
    archivesName = 'aicivilization'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                aicivilization {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                aicivilization {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url 'https://maven.minecraftforge.net/' }
}

// 依存関係のリソースとプロジェクト自身のリソースが重複した場合、最初のものを優先する
tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// shadowJarに同梱する「本当に必要な依存ライブラリだけ」を集めた専用の設定を用意する。
// project.configurations.runtimeClasspath をそのまま使うと、Forge/Minecraft本体が
// 既に内部で持っているライブラリ（fastutil等）まで巻き込んでしまい、
// 起動時にモジュールの重複エラーでクラッシュする原因になるため、
// 明示的に「同梱したい依存だけ」を別のconfigurationに切り出す。
configurations {
    shadowOnly
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    // HTTP通信（Groq API呼び出し用）。okhttpはshadeしてMod内に同梱する。
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    shadowOnly 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON変換（Groqレスポンス解析・記憶ファイル保存用）。
    // gsonはForge/Minecraft本体が既に内部で同梱・使用しているため、
    // Mod側のjarに二重に含めるとモジュール解決エラーで起動時クラッシュする。
    // compileOnlyでコンパイル時にのみ使い、実行時はForge本体のgsonを使う。
    compileOnly 'com.google.code.gson:gson:2.10.1'

    // 管理ダッシュボード用の軽量HTTPサーバー
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    shadowOnly 'org.nanohttpd:nanohttpd:2.3.1'
}

// 依存ライブラリをMod jarに同梱する（利用者が追加インストール不要にするため）
shadowJar {
    archiveClassifier.set('')
    from sourceSets.main.output
    configurations = [project.configurations.shadowOnly]
    relocate 'okhttp3', 'com.aicivilization.mod.shaded.okhttp3'
    relocate 'okio', 'com.aicivilization.mod.shaded.okio'
    relocate 'fi.iki.elonen', 'com.aicivilization.mod.shaded.nanohttpd'
    // gsonはForge本体に同梱済みのためrelocate不要

    // META-INF/services/配下のサービス定義ファイルが依存ライブラリ間で重複した場合、
    // 単純に片方を捨てるのではなく中身をマージする（ModLauncherが同じjarを
    // 複数回検出してしまう不具合の原因になるため）。
    mergeServiceFiles()

    // shadowJarはCopyタスクではなくShadowJar固有のタスクのため、
    // 上のtasks.withType(Copy)の重複排除設定が効かない。ここで明示的に設定する。
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // 依存ライブラリの署名情報が混入するとjarの検証で問題になることがあるため除去する
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    // 依存ライブラリ内のJavaモジュール記述子が残っていると、ModLauncherが
    // 同じjarを複数のモジュールとして誤検出することがあるため除去する
    exclude 'module-info.class'
    exclude '**/module-info.class'
}

reobf {
    shadowJar {}
}

// reobfJar（既定のリオブタスク）が、shadowJarの出力を暗黙に参照してしまい
// タスク順序の検証エラーになるため、明示的な依存関係を宣言する。
// ForgeGradleがreobfJarタスクを登録するタイミングの後に評価する必要があるため、
// afterEvaluateで包む。
afterEvaluate {
    tasks.named('reobfJar') {
        dependsOn tasks.named('shadowJar')
        mustRunAfter tasks.named('shadowJar')
    }
    tasks.named('reobfShadowJar') {
        dependsOn tasks.named('jar')
        mustRunAfter tasks.named('jar')
    }
    tasks.build.dependsOn tasks.named('reobfShadowJar')
}
